<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULLBIT yasal metinleri</title>
<style>:root{color-scheme:light dark;--bg:#F7F8FA;--text:#10131A;--muted:#4A5263;--line:#DDE1E8;--accent:#0B6E8E;--mark:#FFF1C2}
@media (prefers-color-scheme:dark){:root{--bg:#0A0C12;--text:#F2F4F8;--muted:#A3ABBC;--line:#252A37;--accent:#4CC9F0;--mark:#4A3A00}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-underline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px}
header,main,footer{max-width:44rem;margin:0 auto;padding:0 20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;padding-top:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
header .brand{font-weight:600;letter-spacing:.04em;color:var(--text);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:16px;font-size:15px}
nav a[aria-current=page]{color:var(--text);text-decoration:none;font-weight:600}
main{padding-top:24px;padding-bottom:40px}
h1{font-size:28px;line-height:1.25;font-weight:600;margin:0 0 16px}
h2{font-size:20px;line-height:1.3;font-weight:600;margin:32px 0 8px}
h3{font-size:17px;font-weight:600;margin:24px 0 4px}
p,ul,ol{margin:0 0 12px}
ul,ol{padding-left:22px}
li{margin:0 0 6px}
li>ul{margin-top:6px}
.meta{margin:0 0 20px;color:var(--muted);font-size:15px}
.meta div{display:flex;flex-wrap:wrap;gap:0 8px}.meta dt{white-space:nowrap}.meta dt::after{content:":"}.meta dd{margin:0}
.table{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;min-width:34rem;font-size:15px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:8px 12px 8px 0;border-bottom:1px solid var(--line)}
th{font-weight:600}
code{font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
mark{background:var(--mark);color:inherit;padding:0 2px}
.draft{margin:0 0 20px;padding:8px 12px;border:1px solid var(--line);font-size:15px;color:var(--muted)}
footer{padding-top:16px;padding-bottom:32px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}</style>
</head>
<body>

<main id="icerik">

<h2>English</h2>
<ul><li><a href="privacy-en.html">Privacy</a></li><li><a href="support-en.html">Support</a></li></ul>
</main>
<footer>BUSATER YAZILIM A.Ş.</footer>
</body>
</html>
